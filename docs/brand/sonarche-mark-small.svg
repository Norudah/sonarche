<!--
  Sonarche — le jumeau simplifié, grille 16. À employer sous 32 px.
  Même silhouette, même palette, mais les détails d'un pixel sautent :
  hublots, couvercles, sangles, liserés de bordé. En dessous de 32 px ils
  ne dessinent plus rien, ils salissent.
-->
