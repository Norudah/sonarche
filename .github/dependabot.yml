# Keeps the commit-pinned actions current. Pinning by commit is what makes a
# hijacked tag harmless (the release job holds the updater signing key); this
# is what keeps the pins from going stale. One grouped PR a month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
