name: checks (front)

# On pull requests into `main` only: per-push runs repeated local checks at a
# real cost on a private repo. Revisit when the repository goes public.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "eslint.config.js"
      - ".prettierignore"
      - ".github/workflows/checks-front.yml"

concurrency:
  group: checks-front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    # Skip release-please's version-bump PR.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
