name: checks

# On `push` only, never on `pull_request`. Every change lands on develop first,
# so a PR from develop to main would re-run checks on commits already checked —
# on a private repo that is paid minutes for a second opinion nobody asked for.
#
# develop only, not main. Everything that reaches main was already checked on
# develop, and release-please's own commits touch a changelog, a manifest and
# two version numbers — nothing any of these jobs has an opinion about. Running
# them again on the merge was a full cycle, macOS job included, per release.
#
# `paths` keeps this off changes it has nothing to say about.
on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "sidecar/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "eslint.config.js"
      - ".prettierignore"
      - ".github/workflows/checks.yml"

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r sidecar/requirements.txt
      # Everything here runs everywhere now. The cover tests used to skip
      # themselves off macOS because the resize shelled out to `sips`; Pillow
      # took its place, so this Linux job is what proves the sidecar has no
      # platform left in it — at the Linux rate, on every push.
      - run: python -m unittest discover -s sidecar -p "*_test.py"
