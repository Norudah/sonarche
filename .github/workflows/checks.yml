name: checks

# On `push` only, never on `pull_request`. Every change lands on develop first,
# so a PR from develop to main would re-run checks on commits already checked —
# on a private repo that is paid minutes for a second opinion nobody asked for.
#
# `paths` keeps this off the pull request that release-please opens: it touches
# a changelog, a manifest and two version numbers, none of which any of these
# jobs has an opinion about.
on:
  push:
    branches: [develop, main]
    paths:
      - "src/**"
      - "sidecar/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "eslint.config.js"
      - ".prettierignore"
      - ".github/workflows/checks.yml"

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r sidecar/requirements.txt
      # The cover tests that need `sips` skip themselves off macOS; everything
      # else here is plain Python over beets' API.
      - run: python -m unittest discover -s sidecar -p "*_test.py"
