name: checks (sidecar)

# On pull requests into `main` (see checks-front.yml). Runs on Linux, which
# catches macOS-only assumptions in the sidecar.
on:
  pull_request:
    branches: [main]
    paths:
      - "sidecar/**"
      - "scripts/check-python-lock.py"
      - ".github/workflows/checks-sidecar.yml"

concurrency:
  group: checks-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Same flags as the app's install. Quoted: `=:all:` would parse as YAML.
      - run: "pip install --no-deps --only-binary=:all: -r sidecar/requirements.txt"
      - run: python -m unittest discover -s sidecar -p "*_test.py"
      # Re-resolves the lock against PyPI to catch transitive drift.
      - run: python scripts/check-python-lock.py
