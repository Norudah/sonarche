name: build (windows)

# Manual Windows build, publishing nothing. checks-rust.yml only compiles on
# macOS, so this is the way to build and test the `cfg(windows)` code before a
# release. Uses the release job's runtime cache key, warming it.

# `workflow_dispatch` only appears once this file is on `main`; until then,
# push a throwaway `windows/*` branch.
on:
  workflow_dispatch:
  push:
    branches: ["windows/**"]

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache the bundled runtime
        uses: actions/cache@v4
        with:
          path: src-tauri/resources
          key: runtime-x86_64-pc-windows-msvc-${{ hashFiles('scripts/prepare-runtime.mjs', 'sidecar/requirements.txt') }}

      - run: npm ci

      # No `releaseId`: build only, nothing uploaded.
      - uses: tauri-apps/tauri-action@v0
        env:
          # Required because `createUpdaterArtifacts` is on.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Check what was built
        shell: bash
        run: |
          set -euo pipefail
          out="src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          ls -la "$out"/*
          # NSIS only (tauri.windows.conf.json): an MSI adds a UAC prompt to every update.
          if [ -d "$out/msi" ]; then
            echo "an MSI was built — check bundle.targets in tauri.windows.conf.json" >&2
            exit 1
          fi

      # Fail on a missing installer. One-week retention: ~200 MB against a 500 MB
      # private-repo quota.
      - uses: actions/upload-artifact@v4
        with:
          name: sonarche-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
