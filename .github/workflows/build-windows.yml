name: build (windows)

# Manual Windows build, publishing nothing. checks-rust.yml only compiles on
# macOS, so this is the way to build and test the `cfg(windows)` code before a
# release. Uses the release job's runtime cache key, warming it.

# `workflow_dispatch` only appears once this file is on `main`; until then,
# push a throwaway `windows/*` branch.
on:
  workflow_dispatch:
  push:
    branches: ["windows/**"]

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Cache the bundled runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/resources
          key: runtime-x86_64-pc-windows-msvc-${{ hashFiles('scripts/prepare-runtime.mjs', 'sidecar/requirements.txt') }}

      - run: npm ci

      # No `releaseId`: build only, nothing uploaded.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Required because `createUpdaterArtifacts` is on.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Check what was built
        shell: bash
        run: |
          set -euo pipefail
          out="src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          ls -la "$out"/*
          # NSIS only (tauri.windows.conf.json): an MSI adds a UAC prompt to every update.
          if [ -d "$out/msi" ]; then
            echo "an MSI was built — check bundle.targets in tauri.windows.conf.json" >&2
            exit 1
          fi

      # Fail on a missing installer. One-week retention: ~200 MB against a 500 MB
      # private-repo quota.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonarche-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
