name: release-please

on:
  push:
    branches:
      - main
  # Rebuilds a release whose bundle failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and upload to (e.g. sonarche-v0.9.0)
        required: true

# Granted per job: only what each one needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # True only when a release was cut, not when the PR was merely updated.
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # Bumps every version file, Cargo.lock included (release-please-config.json).
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # In this workflow: a separate one triggered by `workflow_run` would fire on
  # every release PR too.
  bundle:
    needs: release-please
    if: ${{ github.event_name == 'workflow_dispatch' || needs.release-please.outputs.released == 'true' }}
    permissions:
      # Uploads the bundles to the release.
      contents: write
    strategy:
      fail-fast: false
      # Serial: each runner merges its platforms into `latest.json`, and parallel
      # runs could overwrite each other's entry.
      max-parallel: 1
      matrix:
        include:
          # Both Macs in one universal bundle, built on Apple Silicon. tauri-action
          # points `darwin-aarch64` and `darwin-x86_64` at it in `latest.json`.
          - runner: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # x64 only; Windows on ARM runs it under emulation.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}

      # `shell: bash` everywhere: Windows defaults to pwsh.
      - name: Read the release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release=$(gh release view "$TAG" --json databaseId,body)
          echo "id=$(jq -r .databaseId <<<"$release")" >> "$GITHUB_OUTPUT"
          # tauri-action takes `notes` for `latest.json` from `releaseBody`, not
          # from the release; the in-app "what's new" parses this text.
          {
            echo 'body<<SONARCHE_RELEASE_BODY'
            jq -r .body <<<"$release"
            echo 'SONARCHE_RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # `prepare-runtime.mjs` no-ops when its `.pin` stamps match, so the key must
      # change with the pins.
      - name: Cache the bundled runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src-tauri/resources
          key: runtime-${{ matrix.target }}-${{ hashFiles('scripts/prepare-runtime.mjs', 'sidecar/requirements.txt') }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater signature (no paid Apple or Authenticode certificates): the app
          # refuses update bundles not signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          releaseBody: ${{ steps.release.outputs.body }}
          args: --target ${{ matrix.target }}
          # Each runner merges its platforms into the uploaded manifest.
          includeUpdaterJson: true

      # Gatekeeper reports an unsealed bundle as "damaged"; fail before users see
      # it. Then check the bundle really serves both Macs.
      - name: Check the macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Sonarche.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          archs=$(lipo -archs "$app/Contents/MacOS/sonarche")
          echo "binary: $archs"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          for arch in aarch64 x86_64; do
            for file in python.tar.gz wheels tools/deno tools/ffmpeg tools/fpcalc; do
              test -e "$app/Contents/Resources/runtime/$arch/$file"
            done
          done

      # Without a `.sig` there is no `latest.json` entry, so apps never see the release.
      - name: Check the updater artifact is signed
        shell: bash
        run: |
          set -euo pipefail
          out="src-tauri/target/${{ matrix.target }}/release/bundle"
          ls "$out"/*/*.sig
          # NSIS only (tauri.windows.conf.json): an MSI adds a UAC prompt to every update.
          if [ "${{ runner.os }}" = "Windows" ] && [ -d "$out/msi" ]; then
            echo "an MSI was built — check bundle.targets in tauri.windows.conf.json" >&2
            exit 1
          fi
