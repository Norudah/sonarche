name: release-please

on:
  push:
    branches:
      - main
  # Rebuilds a release whose bundle failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and upload to (e.g. sonarche-v0.9.0)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # True only when a release was cut, not when the PR was merely updated.
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # In shell: in manifest mode `prs` is set and `pr` empty, and
      # `fromJSON('')` fails the job.
      - name: Resolve the release PR branch
        id: pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          PR: ${{ steps.release.outputs.pr }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          branch=$(printf '%s' "${PR:-}" | jq -r '.headBranchName // empty' 2>/dev/null || true)
          if [ -z "$branch" ]; then
            branch=$(printf '%s' "${PRS:-}" | jq -r '.[0].headBranchName // empty' 2>/dev/null || true)
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ steps.pr.outputs.branch != '' }}
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - name: Sync Cargo.lock on the release PR
        if: ${{ steps.pr.outputs.branch != '' }}
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
          if ! git diff --quiet src-tauri/Cargo.lock; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(deps): sync Cargo.lock version" src-tauri/Cargo.lock
            git push origin "$BRANCH"
          fi

  # In this workflow: a separate one triggered by `workflow_run` would fire on
  # every release PR too.
  bundle:
    needs: release-please
    if: ${{ github.event_name == 'workflow_dispatch' || needs.release-please.outputs.released == 'true' }}
    # One runner per architecture: the bundled Python and wheels are
    # arch-specific, so a universal build would carry two.
    strategy:
      fail-fast: false
      # Serial: each runner merges its platform into `latest.json`, and parallel
      # runs could overwrite each other's entry.
      max-parallel: 1
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          # `macos-13` was retired; a missing label queues forever instead of failing.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          # x64 only; Windows on ARM runs it under emulation.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # `shell: bash` everywhere: Windows defaults to pwsh.
      - name: Find the release just cut
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # `release list` has no `databaseId`; the id comes from the release itself.
          tag="${TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh release list --limit 1 --json tagName,isDraft \
                  --jq '[.[] | select(.isDraft == false)][0].tagName')
          fi
          release=$(gh release view "$tag" --json databaseId,body)
          echo "id=$(jq -r .databaseId <<<"$release")" >> "$GITHUB_OUTPUT"
          # tauri-action takes `notes` for `latest.json` from `releaseBody`, not
          # from the release; the in-app "what's new" parses this text.
          {
            echo 'body<<SONARCHE_RELEASE_BODY'
            jq -r .body <<<"$release"
            echo 'SONARCHE_RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `prepare-runtime.mjs` no-ops when its `.pin` matches, so the key must
      # change with the pins.
      - name: Cache the bundled runtime
        uses: actions/cache@v4
        with:
          path: src-tauri/resources
          key: runtime-${{ matrix.target }}-${{ hashFiles('scripts/prepare-runtime.mjs', 'sidecar/requirements.txt') }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater signature (no paid Apple or Authenticode certificates): the app
          # refuses update bundles not signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          releaseBody: ${{ steps.release.outputs.body }}
          args: --target ${{ matrix.target }}
          # Each runner merges its platform into the uploaded manifest.
          includeUpdaterJson: true

      # Gatekeeper reports an unsealed bundle as "damaged"; fail before publishing.
      - name: Check the macOS bundle is sealed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          out="src-tauri/target/${{ matrix.target }}/release/bundle"
          codesign --verify --deep --strict --verbose=2 "$out/macos/Sonarche.app"

      # Without a `.sig` there is no `latest.json` entry, so apps never see the release.
      - name: Check the updater artifact is signed
        shell: bash
        run: |
          set -euo pipefail
          out="src-tauri/target/${{ matrix.target }}/release/bundle"
          ls "$out"/*/*.sig
          # NSIS only (tauri.windows.conf.json): an MSI adds a UAC prompt to every update.
          if [ "${{ runner.os }}" = "Windows" ] && [ -d "$out/msi" ]; then
            echo "an MSI was built — check bundle.targets in tauri.windows.conf.json" >&2
            exit 1
          fi
