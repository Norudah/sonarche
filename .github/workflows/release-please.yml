name: release-please

on:
  push:
    branches:
      - main
  # Rebuild a release whose bundle failed, without cutting a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and upload to (e.g. sonarche-v0.9.0)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Whether this run actually cut a release, as opposed to only opening or
      # updating the release PR — which is what it does most of the time.
      released: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Resolved in a shell rather than with `fromJSON` in a template: in
      # manifest mode the action fills `prs` (an array) and leaves `pr` empty,
      # and `fromJSON('')` is a template error that fails the job before any
      # step can guard against it. jq reads whichever one is there.
      - name: Resolve the release PR branch
        id: pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          PR: ${{ steps.release.outputs.pr }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          branch=$(printf '%s' "${PR:-}" | jq -r '.headBranchName // empty' 2>/dev/null || true)
          if [ -z "$branch" ]; then
            branch=$(printf '%s' "${PRS:-}" | jq -r '.[0].headBranchName // empty' 2>/dev/null || true)
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ steps.pr.outputs.branch != '' }}
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - name: Sync Cargo.lock on the release PR
        if: ${{ steps.pr.outputs.branch != '' }}
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
          if ! git diff --quiet src-tauri/Cargo.lock; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(deps): sync Cargo.lock version" src-tauri/Cargo.lock
            git push origin "$BRANCH"
          fi

  # The bundles, built here rather than in a workflow of their own. A separate
  # workflow can only be triggered by `workflow_run`, which fires whatever
  # release-please did — so it woke two macOS runners on every release PR, found
  # no release to upload to, and failed. Here the answer is a job output.
  bundle:
    needs: release-please
    if: ${{ github.event_name == 'workflow_dispatch' || needs.release-please.outputs.released == 'true' }}
    # One runner per artifact rather than one universal binary: the app ships
    # its own Python and its own wheels, both architecture-specific, so a
    # universal build would carry two interpreters — 200 MB to spare the user
    # picking a file.
    strategy:
      fail-fast: false
      # One at a time. `latest.json` is read, merged and re-uploaded by every
      # runner, so two finishing at once can each write a manifest missing the
      # other's platform — and a manifest missing a platform is exactly the
      # silence 0.9.0 shipped. Billing is per job-minute, so serialising costs
      # nothing but wall clock on a release cut a few times a month.
      max-parallel: 1
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          # `macos-15-intel`, not `macos-13`: GitHub retired the 13 image, and a
          # job asking for a label that no longer exists does not fail — it
          # queues for a runner that will never come. The 0.9.0 build sat there
          # until it was cancelled by hand.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          # x86_64 only, no `aarch64-pc-windows-msvc`: llvmlite publishes no
          # win_arm64 wheel and numba is a hard dependency of beets, which is
          # the wall the Intel macOS bundle already hit. Windows on ARM runs
          # this build under emulation.
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # `shell: bash` on every scripted step: the Windows runner defaults to
      # pwsh, where none of this parses.
      - name: Find the release just cut
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # `databaseId` is not a field `release list` knows — asking for it is
          # what failed the first time. The tag comes from the list, the id from
          # the release itself.
          tag="${TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh release list --limit 1 --json tagName,isDraft \
                  --jq '[.[] | select(.isDraft == false)][0].tagName')
          fi
          echo "id=$(gh release view "$tag" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The interpreter and the wheels are ~100 MB fetched from GitHub and PyPI.
      # `prepare-runtime.mjs` stamps a `.pin` beside them and no-ops when it
      # matches, so the cache key is what produces them: bump the pin, refetch.
      - name: Cache the bundled runtime
        uses: actions/cache@v4
        with:
          path: src-tauri/resources
          key: runtime-${{ matrix.target }}-${{ hashFiles('scripts/prepare-runtime.mjs', 'sidecar/requirements.txt') }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Our own signature, not the platform's: there is no paid Developer ID
          # and no Authenticode certificate, so macOS is only ad-hoc signed
          # (`signingIdentity: "-"`) and Windows is unsigned — the landing page
          # explains the Gatekeeper and SmartScreen screens. Every update bundle
          # is signed with this key and the app refuses one signed with anything
          # else, which is the protection that actually matters here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          args: --target ${{ matrix.target }}
          # The manifest installed apps poll. Every runner writes it; each one
          # merges its platform into the file the previous ones uploaded.
          includeUpdaterJson: true

      # Gatekeeper reads the bundle signature, not the linker-signed binary the
      # toolchain leaves behind: a .app with no sealed resources is not
      # "unidentified developer", it is "damaged and can't be opened", with
      # Trash as the only button. That was true of 0.9.0, so the job fails here
      # rather than publishing a release nobody can open.
      - name: Check the macOS bundle is sealed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          out="src-tauri/target/${{ matrix.target }}/release/bundle"
          codesign --verify --deep --strict --verbose=2 "$out/macos/Sonarche.app"

      # No `.sig` means no `latest.json`, so installed apps never see the
      # release — the second half of what 0.9.0 got wrong, and the half that
      # applies to every platform.
      - name: Check the updater artifact is signed
        shell: bash
        run: |
          set -euo pipefail
          out="src-tauri/target/${{ matrix.target }}/release/bundle"
          ls "$out"/*/*.sig
          # NSIS only, per tauri.windows.conf.json: an MSI would drag a UAC
          # prompt in behind every update, which is the whole reason it is off.
          if [ "${{ runner.os }}" = "Windows" ] && [ -d "$out/msi" ]; then
            echo "an MSI was built — check bundle.targets in tauri.windows.conf.json" >&2
            exit 1
          fi
