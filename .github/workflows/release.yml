name: release

# Builds the macOS bundles and attaches them to the GitHub Release that
# release-please just cut. Runs after it, on `main`, so the tag and the release
# already exist and there is something to upload to.
on:
  workflow_run:
    workflows: [release-please]
    types: [completed]
    branches: [main]
  # A manual re-run, for a release whose build failed after the tag was made.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and upload to (e.g. v0.9.0)
        required: true

permissions:
  contents: write

jobs:
  bundle:
    # Two runners rather than one universal binary: the app ships its own
    # Python and its own wheels, and both are architecture-specific. A
    # universal build would have to carry two interpreters — 200 MB to spare
    # the user picking a file.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-13
            arch: x86_64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || 'main' }}

      - name: Find the release to upload to
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # On a manual run the tag is given; after release-please it is
          # whatever the latest release is, which is the one it just cut.
          if [ -n "${TAG:-}" ]; then
            id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          else
            id=$(gh release list --limit 1 --json databaseId,isDraft \
                 --jq '.[0] | select(.isDraft == false) | .databaseId')
          fi
          if [ -z "$id" ]; then
            echo "no release to upload to — release-please made no release this run"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "id=$id" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.skip != 'true'

      - uses: swatinem/rust-cache@v2
        if: steps.release.outputs.skip != 'true'
        with:
          workspaces: src-tauri

      # The interpreter and the wheels are ~100 MB fetched from GitHub and
      # PyPI. `prepare-runtime.mjs` stamps a `.pin` beside them and no-ops when
      # it matches, so the cache key is the pin itself: bump the pin, refetch.
      - name: Cache the bundled runtime
        if: steps.release.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: src-tauri/resources
          key: runtime-${{ matrix.arch }}-${{ hashFiles('scripts/prepare-runtime.mjs', 'sidecar/requirements.txt') }}

      - run: npm ci
        if: steps.release.outputs.skip != 'true'

      - uses: tauri-apps/tauri-action@v0
        if: steps.release.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          args: --target ${{ matrix.arch }}-apple-darwin
          # The app is not code-signed: no paid Developer ID, by decision. The
          # landing page explains the Gatekeeper screen instead.
          # `includeUpdaterJson` lands here with the updater plugin — it needs a
          # signing key, and without one the step fails rather than skipping.
