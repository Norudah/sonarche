name: checks (rust)

# Its own workflow, and its own `paths`, because of what it costs. A private
# repository is billed per minute and macOS is billed at **ten times** the Linux
# rate, so this one job spends more than every other job here put together. It
# must not run because a translation string changed, and it must not run twice
# for the same commit — hence develop only, not the merge into main.
#
# macOS and not Linux: the crate has an entire macOS-only half — the objc2 media
# session, the keychain's apple-native backend — that no other platform can even
# compile. Running it elsewhere would prove something about code we do not ship.
on:
  push:
    branches: [develop]
    paths:
      - "src-tauri/**"
      - "!src-tauri/gen/**"
      - ".github/workflows/checks-rust.yml"

concurrency:
  group: checks-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build checks that the frontend output and every declared resource
      # exist before it will compile anything. Stubs rather than the real ones:
      # this job bundles nothing, and fetching the 100 MB runtime to satisfy an
      # existence check would double its length for no answer.
      - name: Stub what tauri-build insists on finding
        run: |
          mkdir -p dist src-tauri/resources/wheels
          touch dist/index.html src-tauri/resources/python.tar.gz
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
