name: checks (rust)

# On the PR into `main` — see checks-front.yml for why the checks moved off
# per-push. This job is the reason that measurement was worth taking: a private
# repository is billed per minute and **macOS counts for ten**, so this one job
# was ~85% of everything the checks spent, to repeat on the same OS what the
# laptop had just said.
#
# macOS and not Linux: the crate has an entire macOS-only half — the objc2 media
# session, the keychain's apple-native backend — that no other platform can even
# compile. Running it elsewhere would prove something about code we do not ship.
on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "!src-tauri/gen/**"
      - ".github/workflows/checks-rust.yml"

concurrency:
  group: checks-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Not release-please's own PR. It rewrites the version in Cargo.toml and
    # tauri.conf.json, both under `src-tauri/**` — without this, every release
    # would wake the priciest runner in the repository for a version bump.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build checks that the frontend output and every declared resource
      # exist before it will compile anything. Stubs rather than the real ones:
      # this job bundles nothing, and fetching the 100 MB runtime to satisfy an
      # existence check would double its length for no answer.
      - name: Stub what tauri-build insists on finding
        run: |
          mkdir -p dist src-tauri/resources/wheels src-tauri/resources/tools
          touch dist/index.html src-tauri/resources/python.tar.gz
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
