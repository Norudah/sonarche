name: checks (rust)

# On pull requests into `main` (see checks-front.yml); macOS runners bill at
# 10x. macOS because part of the crate (objc2 media session, apple-native
# keyring) only compiles there.
on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "!src-tauri/gen/**"
      - ".github/workflows/checks-rust.yml"

concurrency:
  group: checks-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Skip release-please's version-bump PR.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build requires the frontend output and resources to exist; stubs
      # avoid fetching the runtime for a build that bundles nothing.
      - name: Stub what tauri-build insists on finding
        run: |
          mkdir -p dist src-tauri/resources/wheels src-tauri/resources/tools
          touch dist/index.html src-tauri/resources/python.tar.gz
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
