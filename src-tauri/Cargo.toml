[package]
name = "sonarche"
version = "2.5.0"
description = "Your music, from the stream into the ark."
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
# `raw_value`: the library listing is passed through without re-parsing.
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "process", "io-util", "sync", "time", "fs", "rt-multi-thread"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
# Jitter between album downloads.
fastrand = "2"
# The app's own history DB; `bundled` ships SQLite with the binary.
rusqlite = { version = "0.32", features = ["bundled"] }
# Native playback (the webview's <audio> misreported durations) with gapless
# queueing. Formats, not codecs: `mp4` covers AAC and ALAC, `vorbis` brings
# the Ogg demuxer, `wav` the PCM codecs AIFF also needs. Keep in step with
# `audio_formats::PLAYABLE`.
rodio = { version = "0.22", default-features = false, features = [
    "playback",
    "mp4",
    "symphonia-alac",
    "flac",
    "mp3",
    "vorbis",
    "wav",
    "symphonia-aiff",
] }
tauri-plugin-opener = "2.5.4"
# The OS folder picker for library imports; no file read/write permission.
tauri-plugin-dialog = "2.7.2"
# In-app updates, verified against the app's public key.
tauri-plugin-updater = "2.10.1"
# Relaunch after an update installs.
tauri-plugin-process = "2.3.1"
tauri-plugin-clipboard-manager = "2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain storage for API keys. The backend is a per-OS feature; without one
# `keyring` silently forgets everything on exit.
keyring = { version = "3", features = ["apple-native"] }

# macOS media session (MPNowPlayingInfoCenter / MPRemoteCommandCenter) via the
# maintained objc2 bindings. Replaced `souvlaki`, whose `block 0.1.6`
# dependency will stop compiling on a future rustc. Only the used classes are
# enabled.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDictionary",
    "NSString",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-media-player = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "MPMediaItem",
    "MPNowPlayingInfoCenter",
    "MPRemoteCommand",
    "MPRemoteCommandCenter",
    "MPRemoteCommandEvent",
] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows Credential Manager.
keyring = { version = "3", features = ["windows-native"] }
# DWM, to paint the caption bar in the app's colour. Raw bindings: two
# functions, and this version is already in the tree via tao.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # SetFileAttributesW, to hide `.sonarche` on Windows.
    "Win32_Storage_FileSystem",
] }
# No media session on Linux yet: `now_playing` is a no-op there.

[dev-dependencies]
# Real temp directories for the layout/migration tests.
tempfile = "3"
